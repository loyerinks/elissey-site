<script>
  // --- Анимация появления ---
  const revealElements = document.querySelectorAll('.reveal');
  const revealObserver = new IntersectionObserver((entries) => { 
    entries.forEach(entry => { 
      if (entry.isIntersecting) { 
        entry.target.classList.add('active'); 
        revealObserver.unobserve(entry.target); 
      } 
    }); 
  }, { threshold: 0.1 });
  revealElements.forEach(el => revealObserver.observe(el));

  // --- Бургер-меню ---
  const burger = document.getElementById('burger');
  const nav = document.getElementById('nav');
  if (burger && nav) {
    burger.addEventListener('click', () => nav.classList.toggle('active'));
    nav.querySelectorAll('a').forEach(link => { 
      link.addEventListener('click', () => nav.classList.remove('active')); 
    });
  }

  // --- Калькулятор ---
  const baseRadios = document.querySelectorAll('input[name="baseType"]');
  const speedRadios = document.querySelectorAll('input[name="speed"]');
  const extrasCheckboxes = document.querySelectorAll('.calc-extra input[type="checkbox"]');
  const totalPriceEl = document.getElementById('totalPrice');
  const totalTimeEl = document.getElementById('totalTime');
  const receiptBaseName = document.getElementById('receiptBaseName');
  const receiptBasePrice = document.getElementById('receiptBasePrice');
  const receiptExtrasList = document.getElementById('receiptExtrasList');
  const calcSendBtn = document.getElementById('calcSendBtn');

  function updateExtrasVisibility() {
    const selectedType = document.querySelector('input[name="baseType"]:checked').value;
    document.querySelectorAll('.calc-extra').forEach(el => {
      const showFor = el.getAttribute('data-show-for').split(',');
      if (showFor.includes(selectedType)) { 
        el.classList.remove('hidden'); 
      } else {
        el.classList.add('hidden');
        const checkbox = el.querySelector('input[type="checkbox"]');
        if (checkbox.checked) checkbox.checked = false;
      }
    });
    calculate();
  }

  function calculate() {
    let basePrice = 0, baseTime = 0, baseName = '', multiplier = 1, timeMod = 0, speedName = '';
    let extrasPrice = 0, extrasTime = 0, extrasListHTML = '', selectedExtrasText = [];

    baseRadios.forEach(radio => { 
      if (radio.checked) { 
        basePrice = parseInt(radio.dataset.price); 
        baseTime = parseInt(radio.dataset.time); 
        baseName = radio.parentElement.querySelector('.calc-tab-label').childNodes[0].textContent.trim(); 
      } 
    });
    
    speedRadios.forEach(radio => { 
      if (radio.checked) { 
        multiplier = parseFloat(radio.dataset.mult); 
        timeMod = parseInt(radio.dataset.timeMod); 
        speedName = radio.value; 
      } 
    });

    extrasCheckboxes.forEach(checkbox => {
      if (checkbox.checked && !checkbox.closest('.calc-extra').classList.contains('hidden')) {
        let price = parseInt(checkbox.dataset.price); 
        extrasPrice += price; 
        extrasTime += parseInt(checkbox.dataset.time);
        selectedExtrasText.push(checkbox.value); 
        receiptExtrasList.style.display = 'block';
        extrasListHTML += `<div class="receipt-row" style="font-size: 14px; margin-bottom: 8px; color: var(--ink);"><span>+ ${checkbox.value}</span><span>${price} ₽</span></div>`;
      }
    });

    let finalPrice = Math.round((basePrice + extrasPrice) * multiplier);
    let finalTime = baseTime + extrasTime + timeMod; 
    if (finalTime < 1) finalTime = 1;

    if (receiptBaseName) receiptBaseName.innerText = baseName; 
    if (receiptBasePrice) receiptBasePrice.innerText = basePrice.toLocaleString('ru-RU') + ' ₽';
    if (receiptExtrasList) receiptExtrasList.innerHTML = extrasListHTML; 
    if (totalPriceEl) totalPriceEl.innerText = finalPrice.toLocaleString('ru-RU') + ' ₽';
    
    let timeText = `Срок: от ${finalTime} ${finalTime === 1 ? 'дня' : (finalTime < 5 ? 'дней' : 'дней')}`;
    if (speedName !== 'Стандарт') timeText += ` (режим: ${speedName})`; 
    if (totalTimeEl) totalTimeEl.innerText = timeText;

    if (calcSendBtn) {
      let message = `Привет! Я собрал(а) проект на сайте.%0A%0A*Тип:* ${baseName}%0A*Сроки:* ${speedName}%0A`;
      if (selectedExtrasText.length > 0) message += `*Дополнительно:* ${selectedExtrasText.join(', ')}%0A`;
      message += `*Итоговая стоимость:* ${finalPrice} ₽%0A*Ориентировочный срок:* ${finalTime} дн.%0A%0AДавайте обсудим!`;
      calcSendBtn.href = `https://t.me/elloyer?text=${message}`;
    }
  }

  if (baseRadios.length > 0) {
    baseRadios.forEach(r => r.addEventListener('change', updateExtrasVisibility));
    speedRadios.forEach(r => r.addEventListener('change', calculate));
    extrasCheckboxes.forEach(c => c.addEventListener('change', calculate));
    updateExtrasVisibility(); 
    calculate();
  }

  // --- ОТПРАВКА ФОРМЫ В TELEGRAM (ЧЕРЕЗ CLOUDFLARE WORKER) ---
  const contactForm = document.getElementById('contactForm');
  if (contactForm) {
    contactForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const name = document.getElementById('contactName').value; 
      const contact = document.getElementById('contactContact').value; 
      const task = document.getElementById('contactMessage').value;
      
      const successEl = document.getElementById('formSuccess'); 
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = 'Отправка...'; 
      submitBtn.style.opacity = '0.7'; 
      submitBtn.style.pointerEvents = 'none';
      
      try {
        // ТВОЙ ЗАЩИЩЕННЫЙ ВОРКЕР
        const WORKER_URL = 'https://elloyer-form.aisik20267.workers.dev/'; 
        
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, contact, task })
        });

        if (response.ok) { 
          successEl.style.display = 'block'; 
          submitBtn.innerText = 'Отправлено!'; 
          this.reset(); 
          setTimeout(() => { 
            successEl.style.display = 'none'; 
            submitBtn.innerText = 'Отправить заявку'; 
            submitBtn.style.opacity = '1'; 
            submitBtn.style.pointerEvents = 'auto'; 
          }, 4000); 
        } else { 
          throw new Error('Ошибка'); 
        }
      } catch (error) { 
        alert('Ошибка отправки. Проверьте интернет.'); 
        submitBtn.innerText = 'Отправить заявку'; 
        submitBtn.style.opacity = '1'; 
        submitBtn.style.pointerEvents = 'auto'; 
      }
    });
  }
</script>
